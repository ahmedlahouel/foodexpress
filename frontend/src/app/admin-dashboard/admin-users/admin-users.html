<div class="container my-4">
  <h2 class="mb-3">Utilisateurs</h2>

  <form class="row g-2 mb-3" (ngSubmit)="applyFilters()">
    <div class="col-md-6">
      <input name="search" class="form-control" placeholder="Rechercher (nom, prénom, email)"
             [ngModel]="search()" (ngModelChange)="search.set($event)" />
    </div>
    <div class="col-md-3">
      <select name="role" class="form-select"
              [ngModel]="roleFilter()" (ngModelChange)="roleFilter.set($event); applyFilters()">
        <option value="">Tous les rôles</option>
        @for (r of roles; track r) {
        <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-primary w-100">Rechercher</button>
    </div>
  </form>

  <app-error-message [message]="error()" />

  @if (loading()) {
  <app-loading />
  } @else {
  <div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
      <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Rôle</th>
        <th>Statut</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      @for (u of users(); track u._id) {
      <tr>
        <td>{{ u.prenom }} {{ u.nom }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.telephone }}</td>
        <td>
          <select class="form-select form-select-sm" [disabled]="isMe(u)"
                  (change)="changeRole(u, $any($event.target).value)">
            @for (r of roles; track r) {
            <option [value]="r" [selected]="u.role === r">{{ r }}</option>
            }
          </select>
        </td>
        <td>
                <span class="badge" [class.bg-success]="u.isActive" [class.bg-secondary]="!u.isActive">
                  {{ u.isActive ? 'Actif' : 'Désactivé' }}
                </span>
        </td>
        <td class="text-end">
          <button class="btn btn-sm" [class.btn-outline-danger]="u.isActive"
                  [class.btn-outline-success]="!u.isActive" [disabled]="isMe(u)"
                  (click)="toggleStatus(u)">
            {{ u.isActive ? 'Désactiver' : 'Activer' }}
          </button>
        </td>
      </tr>
      } @empty {
      <tr><td colspan="6" class="text-center text-muted py-4">Aucun utilisateur trouvé</td></tr>
      }
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center">
    <span class="text-muted small">{{ total() }} utilisateur(s)</span>
    <div class="btn-group">
      <button class="btn btn-outline-dark btn-sm" [disabled]="page() <= 1" (click)="goTo(page() - 1)">Précédent</button>
      <button class="btn btn-outline-dark btn-sm" disabled>{{ page() }} / {{ totalPages() }}</button>
      <button class="btn btn-outline-dark btn-sm" [disabled]="page() >= totalPages()" (click)="goTo(page() + 1)">Suivant</button>
    </div>
  </div>
  }
</div>
