<div class="container my-5" style="max-width: 520px">
  <h2 class="mb-3">Inscription</h2>

  <form (ngSubmit)="submit()">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Nom</label>
        <input name="nom" class="form-control" [ngModel]="nom()" (ngModelChange)="nom.set($event)" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Prénom</label>
        <input name="prenom" class="form-control" [ngModel]="prenom()" (ngModelChange)="prenom.set($event)" />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </div>
    <div class="mb-3">
      <label class="form-label">Téléphone</label>
      <input name="telephone" class="form-control" [ngModel]="telephone()" (ngModelChange)="telephone.set($event)" />
    </div>
    <div class="mb-3">
      <label class="form-label">Mot de passe</label>
      <input type="password" name="password" class="form-control" [ngModel]="password()" (ngModelChange)="password.set($event)" />
      <div class="form-text">Au moins 8 caractères, une lettre et un chiffre.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmation du mot de passe</label>
      <input type="password" name="confirmation" class="form-control" [ngModel]="confirmation()" (ngModelChange)="confirmation.set($event)" />
    </div>

    @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
      {{ loading() ? 'Inscription...' : "S'inscrire" }}
    </button>
  </form>

  <p class="mt-3 mb-0 text-center">
    Déjà un compte ? <a routerLink="/login">Connexion</a>
  </p>
</div>
